#cloud-config
package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Terraform ELB Lab</title>
      </head>
      <body>
        <h1>Huawei Cloud ELB Lab</h1>
        <p>Backend: Terraform ECS</p>
      </body>
      </html>

runcmd:
  - systemctl enable nginx
  - sed -i "s/Backend: Terraform ECS/Backend: $(hostname)/" /var/www/html/index.html
  - systemctl restart nginx